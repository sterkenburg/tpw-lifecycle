# CI/CD for the TPW Lifecycle daily pipeline.
#
# The deploy target is a Cloud Run *Job* — `tpw-lifecycle-daily` in project
# tpw-ga4-bigquery / region europe-west4 — which runs `python jobs/daily_pipeline.py`.
# A Cloud Scheduler job of the same name triggers it at 07:00 Europe/Amsterdam.
# (There are no `-api` / `-dashboard` Cloud Run services: the supplier-facing
# dashboard is the Next.js app on Vercel, the API is not deployed here.)
#
# NOTE: the Artifact Registry repo is still `tpw-retention`. Only the deploy
# identity (job + scheduler) was renamed to lifecycle; the registry/data layer was
# deliberately left on the `retention*` names, so the image path stays as-is.

steps:
  - name: "gcr.io/cloud-builders/docker"
    env: [DOCKER_BUILDKIT=1]
    entrypoint: bash
    args:
      - -ceu
      - |
        docker build -t europe-west4-docker.pkg.dev/tpw-ga4-bigquery/tpw-retention/app:$BUILD_ID .
        docker push europe-west4-docker.pkg.dev/tpw-ga4-bigquery/tpw-retention/app:$BUILD_ID
        docker image inspect --format '{{index .RepoDigests 0}}' europe-west4-docker.pkg.dev/tpw-ga4-bigquery/tpw-retention/app:$BUILD_ID > /workspace/release-image

  # Update configuration only. Do not execute the daily pipeline from CI.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -ceu
      - |
        image=$$(cat /workspace/release-image)
        case "$$image" in europe-west4-docker.pkg.dev/tpw-ga4-bigquery/tpw-retention/app@sha256:*) ;; *) exit 1;; esac
        # Preserve the bounded retry for concurrent Cloud Run Job updates.
        updated=false
        for attempt in 1 2 3 4 5; do
          if gcloud run jobs update tpw-lifecycle-daily --image="$$image" --project=tpw-ga4-bigquery --region=europe-west4 --quiet; then
            updated=true
            break
          fi
          sleep $$((attempt * 5))
        done
        test "$$updated" = true
        gcloud run jobs describe tpw-lifecycle-daily --project=tpw-ga4-bigquery --region=europe-west4 --format='json(spec.template.spec.template.spec.containers[].image,status.conditions)' > /workspace/job.json
        python3 -c 'import json,sys; d=json.load(open("/workspace/job.json")); assert d["spec"]["template"]["spec"]["template"]["spec"]["containers"][0]["image"]==sys.argv[1]; assert next(c for c in d["status"]["conditions"] if c["type"]=="Ready")["status"]=="True"' "$$image"

options:
  logging: CLOUD_LOGGING_ONLY
