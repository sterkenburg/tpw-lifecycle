[project]
name = "tpw-lifecycle"
version = "0.1.0"
description = "The Perfect Wedding — Supplier Lifecycle Platform"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-gbq>=0.19",
    "google-cloud-bigquery>=3.11",
    "google-cloud-storage>=2.10",
    "streamlit>=1.28",
    "plotly>=5.18",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "jinja2>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
