# TPW Lifecycle Platform — Configuration
# Extracted from existing churn_prediction project
# Override with environment variables: TPW__SECTION__KEY=value

bigquery:
  project_id: "tpw-ga4-bigquery"
  # Single EU dataset (migrated US→EU 2026-06-05 — holds EU supplier PII; co-located
  # with GA4 (EU) sources). dataset_eu kept as an alias = dataset so EU-sourced
  # rollups (exposure) and platform tables share one dataset.
  dataset: "retention"              # EU
  dataset_eu: "retention"           # EU (same dataset; was retention_eu before consolidation)
  location: "EU"

# Source tables (from existing project)
sources:
  # Business data — supplier profiles, plans, AM assignments
  business_table: "tpw-ga4-bigquery.churn_prediction.business_development"
  
  # GA4 processed pageview events (Dataform output)
  pageviews_table: "tpw-ga4-bigquery.ga4_dataform_output.bedrijven_pageview_events"
  
  # Lead events — when couples submit contact forms
  leads_table: "tpw-ga4-bigquery.ga4_dataform_output.generate_lead"
  
  # Phone reveals — when couples click "show phone"
  phone_reveals_table: "tpw-ga4-bigquery.ga4_dataform_output.show_phone"

  # Supplier email source (D1). No email column exists in the business/profiles
  # tables yet. When an email feed becomes available, set:
  #   supplier_email_table:  fully-qualified table with profile_id + email
  #   supplier_email_column: the email column name on that table
  # Until both are set, suppliers have no email and are simply not emailable
  # (the daily pipeline reports how many addresses are missing).
  supplier_email_table: ""
  supplier_email_column: ""
  
  # Matches / inquiries
  matches_table: "tpw-ga4-bigquery.ga4_dataform_output.bedrijven_matches"

  # Per-supplier daily funnel (reporting rollup; dashboard source). Skeleton of
  # (profile_id, date, event_name) rows where the metric column named after
  # event_name holds the value. Source for supplier_exposure_daily (WS-A).
  monthly_profile_stats: "tpw-ga4-bigquery.ga4_dataform_reporting.monthly_profile_stats"
  
  # Lead conversion tracking (won/lost/accepted)
  conversions_table: "tpw-ga4-bigquery.ga4_dataform_customer_journey.cj_lead_scoring"
  
  # Raw GA4 events (fallback if processed tables missing)
  raw_ga4_dataset: "tpw-ga4-bigquery.analytics_251061328"
  raw_ga4_events: "events_*"

# Lifecycle platform tables (read/write — created by this platform). Table/dataset
# names still use the `retention*` prefix pending a rename migration.
tables:
  supplier_stats: "supplier_stats_daily"
  supplier_exposure: "supplier_exposure_daily"   # EU (retention)
  supplier_targeting: "supplier_targeting"       # EU (retention)
  cohort_assignment: "cohort_assignment"         # EU (retention) — holdout SoT
  retention_directives: "retention_directives"   # EU (retention) — what each supplier gets
  signals: "signals_daily"
  actions_log: "actions_log"
  outcomes: "outcomes"
  email_log: "email_log"
  intervention_log: "intervention_log"

# Thresholds
# Note: old system used 0.304 (dashboard), 0.60 (production), 0.78 (hybrid)
# We use a single conservative threshold to reduce false positives
thresholds:
  # Tiers apply ONLY to undecided suppliers (renewal_status = active). Scheduled
  # cancellations (will_churn), renewed and churned suppliers get no tier.
  # Cutoffs set 2026-11-10 on a T-60 backtest of 174 undecided terms (23 churned):
  # non-renewal P1 50%, P2 25%, P3 11%, P4 5%. Re-check once outcomes accumulate.
  churn_p1: 0.55               # urgent: call  (~8% of undecided)
  churn_p2: 0.45               # high: email + monitor  (~10%)
  churn_p3: 0.30               # medium: nurture  (~38%)
  no_lead_days: 45             # trigger re-engagement
  renewal_days: 60             # trigger renewal prep
  engagement_decline: -0.5     # 50% drop vs previous month

# Churn risk score (src/signals/churn_scorer.py). Hand-set, rule-based: a relative
# risk ranking, not a calibrated probability.
churn_scoring:
  # Starting point = historical non-renewal rate by number of PRIOR paid plans
  # (annual terms ending 2024-06..2026-09, n=3,276; churn review 2026-11-10).
  # Keys are the minimum prior-plan count for the bucket.
  prior_plan_base:
    0: 0.40                    # first paid term
    1: 0.32
    2: 0.23
    3: 0.19                    # 3-4
    5: 0.135                   # 5-7
    8: 0.11                    # 8+
  unknown_plan_history_base: 0.40   # num_paid_plans_before missing (~7%; churn ~41%)
  # Behaviour adjustments (added to the base)
  no_views_90d: 0.15           # no profile views at all in the 90-day window
  per_day_since_last_view: 0.0025   # capped at view_recency_cap_days
  view_recency_cap_days: 60
  low_views_60d: 0.05          # fewer than low_views_threshold views in 60 days
  low_views_threshold: 10
  views_down_50pct: 0.08       # equal-window trend <= -50%
  views_down_20pct: 0.03       # equal-window trend <= -20%
  no_leads_60d: 0.05           # no lead in 60 days (or none in the 90-day window)
  renewal_within_30d: 0.05     # 0-30 days to plan_end
  ended_no_renewal: 0.15       # plan_end passed, no renewal or cancellation booked

# API keys (use env vars in production)
# sendgrid_api_key: "${SENDGRID_API_KEY}"
# slack_webhook_url: "${SLACK_WEBHOOK_URL}"
# messagebird_api_key: "${MESSAGEBIRD_API_KEY}"
# crm_api_key: "${CRM_API_KEY}"

# Email settings
email:
  from_name: "ThePerfectWedding"
  from_address: "partners@theperfectwedding.nl"
  monthly_send_day: 1          # 1st of month
  monthly_send_hour: 9
  # Master safety switch. When true (default), the pipeline computes and logs
  # which emails *would* be sent but does not call SendGrid. Set the env var
  # EMAIL_DRY_RUN=false (and provide SENDGRID_API_KEY) to send for real.
  dry_run: true
  # Minimum days between two sends of the same flow to one supplier (dedup).
  dedup_days:
    monthly_results: 25
    re_engagement: 14
    renewal_prep: 21

# Directive emitters (WS-D). The platform COMPUTES directives for the treatment
# arm regardless; these flags control whether a channel actually DISPATCHES.
# Flip a channel ON only after its G0 confirmation spike proves the integration —
# until then its directives are written with status='gated' (pending the spike).
directives:
  elastic_enabled: false      # boost  → Elastic; gated on YOO-228 (Elastic owner)
  bird_enabled: false         # newsletter + email → Bird/marketing_flow; gated on Bird spike
  scraper_enabled: false      # optimize → profile_auto_complete; gated on scraper spike
  onboarding_enabled: false   # onboarding → Bird/marketing_flow; first-term cohort (doc 28)
  winback_enabled: false      # winback → Bird/marketing_flow; lapsed-supplier cohort (doc 28)
  # Even when a channel is enabled, dry_run logs the dispatch instead of sending.
  dry_run: true
  # Exposure redistribution operates in the FREE/owned layer only — never the
  # paid premium inventory (paid-product guardrail, docs/strategy/18 Lever 1).
  boost_layer: "free"

# Legacy pre-holdout emitters in the 7AM daily pipeline (P1 CRM tasks + the
# deprecated SendGrid email flows). OFF: the pipeline still computes stats and
# signals and posts the aggregate Slack summary, but emits NO per-supplier
# actions — dispatch is owned by the directives system (WS-D), which enforces
# the holdout structurally. These flows predate the holdout and were logging
# crm_task intents for stage1 CONTROL suppliers (doc 29 §5). If temporarily
# re-enabled, the pipeline excludes every supplier enrolled in any experiment
# (both arms) so the pilot stays measurable.
legacy_actions:
  enabled: false

# Notifications
notifications:
  sms_enabled: true
  email_enabled: true
  quiet_hours_start: "22:00"
  quiet_hours_end: "08:00"
