# TPW Lifecycle Platform — Configuration
# Extracted from existing churn_prediction project
# Override with environment variables: TPW__SECTION__KEY=value

bigquery:
  project_id: "tpw-ga4-bigquery"
  # Single EU dataset (migrated US→EU 2026-06-05 — holds EU supplier PII; co-located
  # with GA4 (EU) sources). dataset_eu kept as an alias = dataset so EU-sourced
  # rollups (exposure) and platform tables share one dataset.
  dataset: "retention"              # EU
  dataset_eu: "retention"           # EU (same dataset; was retention_eu before consolidation)
  location: "EU"

# Source tables (from existing project)
sources:
  # Business data — supplier profiles, plans, AM assignments
  business_table: "tpw-ga4-bigquery.churn_prediction.business_development"
  
  # GA4 processed pageview events (Dataform output)
  pageviews_table: "tpw-ga4-bigquery.ga4_dataform_output.bedrijven_pageview_events"
  
  # Lead events — when couples submit contact forms
  leads_table: "tpw-ga4-bigquery.ga4_dataform_output.generate_lead"
  
  # Phone reveals — when couples click "show phone"
  phone_reveals_table: "tpw-ga4-bigquery.ga4_dataform_output.show_phone"

  # Supplier email source (D1). No email column exists in the business/profiles
  # tables yet. When an email feed becomes available, set:
  #   supplier_email_table:  fully-qualified table with profile_id + email
  #   supplier_email_column: the email column name on that table
  # Until both are set, suppliers have no email and are simply not emailable
  # (the daily pipeline reports how many addresses are missing).
  supplier_email_table: ""
  supplier_email_column: ""
  
  # Matches / inquiries
  matches_table: "tpw-ga4-bigquery.ga4_dataform_output.bedrijven_matches"

  # Per-supplier daily funnel (reporting rollup; dashboard source). Skeleton of
  # (profile_id, date, event_name) rows where the metric column named after
  # event_name holds the value. Source for supplier_exposure_daily (WS-A).
  monthly_profile_stats: "tpw-ga4-bigquery.ga4_dataform_reporting.monthly_profile_stats"
  
  # Lead conversion tracking (won/lost/accepted)
  conversions_table: "tpw-ga4-bigquery.ga4_dataform_customer_journey.cj_lead_scoring"
  
  # Raw GA4 events (fallback if processed tables missing)
  raw_ga4_dataset: "tpw-ga4-bigquery.analytics_251061328"
  raw_ga4_events: "events_*"

# Lifecycle platform tables (read/write — created by this platform). Table/dataset
# names still use the `retention*` prefix pending a rename migration.
tables:
  supplier_stats: "supplier_stats_daily"
  supplier_exposure: "supplier_exposure_daily"   # EU (retention)
  supplier_targeting: "supplier_targeting"       # EU (retention)
  cohort_assignment: "cohort_assignment"         # EU (retention) — holdout SoT
  retention_directives: "retention_directives"   # EU (retention) — what each supplier gets
  signals: "signals_daily"
  actions_log: "actions_log"
  outcomes: "outcomes"
  email_log: "email_log"
  intervention_log: "intervention_log"

# Thresholds
# Note: old system used 0.304 (dashboard), 0.60 (production), 0.78 (hybrid)
# We use a single conservative threshold to reduce false positives
thresholds:
  # Tiers apply ONLY to undecided suppliers (renewal_status = active). Scheduled
  # cancellations (will_churn), renewed and churned suppliers get no tier.
  # Cutoffs on the fitted model's probability of NOT renewing (calibrated at
  # 60 days before plan end; config/churn_model.json). 2026-11-10: P1 48,
  # P2 161, P3 360, P4 695 of 1,264 undecided suppliers.
  churn_p1: 0.50               # urgent: call
  churn_p2: 0.35               # high: email + monitor
  churn_p3: 0.20               # medium: nurture
  no_lead_days: 45             # trigger re-engagement
  renewal_days: 60             # trigger renewal prep
  engagement_decline: -0.5     # 50% drop vs previous month

# Churn risk model: fitted logistic regression in config/churn_model.json
# (src/signals/churn_model.py). Refit quarterly with jobs/fit_churn_model.py and
# review the printed validation in a PR before merging the new model file.

# actions — dispatch is owned by the directives system (WS-D), which enforces
# the holdout structurally. These flows predate the holdout and were logging
# crm_task intents for stage1 CONTROL suppliers (doc 29 §5). If temporarily
# re-enabled, the pipeline excludes every supplier enrolled in any experiment
# (both arms) so the pilot stays measurable.
legacy_actions:
  enabled: false

# Notifications
notifications:
  sms_enabled: true
  email_enabled: true
  quiet_hours_start: "22:00"
  quiet_hours_end: "08:00"
